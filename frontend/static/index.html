<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoyageAI Travel Concierge</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
<style>
  :root { 
    --accent: #0d9488; 
    --accent-hover: #0f766e; 
    --accent-gradient: linear-gradient(135deg, #0d9488 0%, #0369a1 100%);
    --bg: #f8fafc; 
    --border: #e2e8f0; 
    --text-main: #0f172a;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; color: var(--text-main); }
  
  /* Modern Header */
  header { 
    background: var(--accent-gradient); 
    color: #fff; 
    padding: 1rem 1.5rem; 
    box-shadow: 0 4px 16px rgba(13, 148, 136, 0.2); 
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand-icon { font-size: 1.6rem; }
  .brand-title { font-weight: 700; font-size: 1.3rem; letter-spacing: -0.01em; line-height: 1.2; }
  .brand-subtitle { font-size: 0.8rem; opacity: 0.85; font-weight: 400; }
  .status-badge { display: flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.15); backdrop-filter: blur(4px); padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
  .status-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

  /* Log & Messages */
  #log { flex: 1; overflow-y: auto; padding: 1.5rem; max-width: 820px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  
  .msg { display: flex; flex-direction: column; gap: 0.25rem; max-width: 85%; animation: slideIn 0.25s ease-out forwards; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }

  .msg-author { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem; padding: 0 0.25rem; }
  
  .bubble { 
    padding: 0.85rem 1.1rem; 
    border-radius: 16px; 
    background: #ffffff; 
    border: 1px solid var(--border); 
    text-align: left; 
    line-height: 1.5;
    font-size: 0.98rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
    white-space: pre-wrap; 
    word-break: break-word;
  }
  .msg.user .bubble { 
    background: var(--accent-gradient); 
    color: #ffffff; 
    border: none; 
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 14px rgba(13, 148, 136, 0.25);
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background: transparent; border: none; padding: 0; box-shadow: none; max-width: 100%; white-space: normal; }
  
  /* Example Prompt Chips */
  .suggestions { display: flex; gap: 0.6rem; padding: 0.75rem 1.5rem 0.25rem; overflow-x: auto; background: #ffffff; max-width: 820px; margin: 0 auto; width: 100%; border-top: 1px solid var(--border); }
  .chip { padding: 0.45rem 0.95rem; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; background: #f8fafc; color: #334155; cursor: pointer; white-space: nowrap; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); font-family: inherit; font-weight: 500; }
  .chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(13, 148, 136, 0.2); }

  /* Input Form */
  form { display: flex; gap: 0.6rem; padding: 0.85rem 1.5rem 1.25rem; background: #ffffff; max-width: 820px; margin: 0 auto; width: 100%; }
  input { flex: 1; padding: 0.8rem 1.1rem; border: 1px solid var(--border); border-radius: 12px; font-size: 0.98rem; font-family: inherit; transition: all 0.2s ease; background: #f8fafc; }
  input:focus { outline: none; background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15); }
  button { padding: 0.8rem 1.3rem; border: none; border-radius: 12px; background: var(--accent-gradient); color: #fff; font-weight: 600; font-size: 0.95rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 3px 10px rgba(13, 148, 136, 0.25); display: flex; align-items: center; gap: 0.4rem; }
  button:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(13, 148, 136, 0.35); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.04); max-width: 100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top: .6rem; }
  .a2col { display: flex; flex-direction: column; gap: .4rem; }
  .a2row { display: flex; flex-direction: row; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.4; }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: #1e293b; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: #334155; }
  .a2text.a2-caption { font-size: .85rem; color: #64748b; }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: .5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="brand-icon">✈️</span>
    <div>
      <div class="brand-title">VoyageAI</div>
      <div class="brand-subtitle">Personal Travel Concierge</div>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span> Online
  </div>
</header>
<div id="log"></div>
<div class="suggestions">
  <button type="button" class="chip" onclick="sendExample('Discover top cultural destinations in Japan')">🌸 Discover Japan Destinations</button>
  <button type="button" class="chip" onclick="sendExample('Check Tokyo weather and convert $2500 USD to JPY')">🗼 Tokyo Weather & Currency</button>
  <button type="button" class="chip" onclick="sendExample('Generate a scenic postcard for Tokyo at sunset')">📷 Generate Tokyo Postcard</button>
</div>
<form id="form">
  <input id="input" placeholder="Ask VoyageAI about destinations, budgets, weather…" autocomplete="off" autofocus>
  <button>Send ✈️</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendExample(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const author = el("div", "msg-author", who === "user" ? "👤 You" : "✈️ VoyageAI");
  const b = el("div", "bubble");
  m.appendChild(author);
  m.appendChild(b); 
  log.appendChild(m); 
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
